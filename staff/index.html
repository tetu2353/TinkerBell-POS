<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tinker Bell Staff</title>
<style>
:root{--bg:#050505;--panel:#111;--gold:#d8aa43;--gold2:#f5dc91;--cream:#f7f1e8;--muted:#b8ae9e;--red:#d64d68;--blue:#1b4f89}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a130b,#050505 35%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.96);border-bottom:1px solid #3a2b13;padding:14px 16px}
.brand{font:italic 32px Georgia,serif;color:var(--gold2)}.sub{font-size:11px;color:var(--gold)}
main{max-width:900px;margin:auto;padding:14px 14px 90px}
.card{background:linear-gradient(145deg,#181818,#090909);border:1px solid var(--gold);border-radius:18px;padding:15px;margin-bottom:13px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{min-height:135px;border:1px solid var(--gold);border-radius:18px;background:linear-gradient(145deg,#26112d,#0b0b0b);color:#fff;padding:16px;text-align:center}.tile .ico{font-size:38px;display:block;margin-bottom:10px}.tile b{display:block;color:var(--gold2);font-size:18px}.tile small{display:block;color:#ddd;margin-top:6px;font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#292929;color:#fff}.btn.gold{background:linear-gradient(#f0d079,#b78326);color:#111}.btn.ghost{border:1px solid var(--gold);background:transparent;color:var(--gold2)}.btn.red{background:#8d263b}.full{width:100%}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.section-head h2{margin:0;color:var(--gold2)}
label{display:block;margin-bottom:10px}label span{display:block;color:#d9c38c;font-size:12px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #6a5325;background:var(--cream);color:#111}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:8px;overflow-x:auto;padding-bottom:5px}
.week-day{min-width:112px;border:1px solid #4d3a1b;border-radius:14px;background:#111;padding:10px;text-align:center}.week-day .date{font-weight:900;color:var(--gold2)}.week-day .dow{font-size:11px;color:#aaa;margin:4px 0 8px}
.mark-group{display:flex;gap:5px;justify-content:center}.mark-btn{width:34px;height:34px;border-radius:50%;border:1px solid #6a5325;background:#1a1a1a;color:#ddd;font-weight:900}.mark-btn.selected{background:var(--gold);color:#111}
.week-table-wrap{overflow-x:auto}.week-table{min-width:760px;display:grid;grid-template-columns:130px repeat(7,1fr);border:1px solid #4d3a1b;border-radius:14px;overflow:hidden}.cell{padding:10px;text-align:center;border-right:1px solid #392d18;border-bottom:1px solid #392d18;background:#101010}.cell.head{background:#1a1409;color:var(--gold2);font-weight:900}.cell.name{text-align:left;font-weight:900}.mark{font-size:24px;font-weight:900}.o{color:#65d78a}.tri{color:#f2c94c}.x{color:#ff7070}.none{color:#666}
.list{display:grid;gap:9px}.row{background:#111;border:1px solid #46371e;border-radius:13px;padding:12px;color:#fff;text-align:left}.row .title{font-size:18px;font-weight:900}.meta{color:#c2b8aa;font-size:12px;line-height:1.6;margin-top:5px}
dialog{border:0;padding:0;background:#0b0b0b;color:#fff;border-radius:18px;width:min(680px,95vw);max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.75)}.modal{padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;color:var(--gold2)}.close{border:0;border-radius:50%;width:38px;height:38px;background:#222;color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:1/-1}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid #6a5325;background:#161616;color:#ddd;border-radius:999px;padding:8px 11px}.choice.selected{background:var(--gold);color:#111}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.week-grid{grid-template-columns:repeat(7,112px)}}
</style>
</head>
<body>
<header><div class="brand">Tinker Bell</div><div class="sub">ティンカーベル</div></header>
<main>
<section id="home">
 <div class="card"><div style="font-size:20px;font-weight:900;color:var(--gold2)">スタッフメニュー</div><div class="meta">必要な項目をタップしてください</div></div>
 <div class="menu">
  <button class="tile" data-view="shift-register"><span class="ico">🗓️</span><b>シフト登録</b><small>〇・△・×で1週間登録</small></button>
  <button class="tile" data-view="shift-check"><span class="ico">📅</span><b>シフト確認</b><small>全員分を1週間表示</small></button>
  <button class="tile" id="addScheduleHome"><span class="ico">🥂</span><b>同伴・来店予定を登録</b><small>予定を入力</small></button>
  <button class="tile" data-view="schedules"><span class="ico">📋</span><b>同伴・来店予定</b><small>日程一覧を確認</small></button>
  <button class="tile" data-view="customers"><span class="ico">👤</span><b>お客様情報</b><small>登録・検索・編集</small></button>
  <button class="tile" data-view="bottles"><span class="ico">🍾</span><b>ボトル確認</b><small>キープ状況を管理</small></button>
  <button class="tile" data-view="notices"><span class="ico">📣</span><b>お知らせ</b><small>最新情報を確認</small></button>
  <button class="tile" id="adminBtn"><span class="ico">🔒</span><b>管理者専用</b><small>店内状況・売上状況</small></button>
 </div>
</section>

<section id="shift-register" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="card" style="margin-top:12px">
  <div class="section-head"><h2>シフト登録</h2></div>
  <label><span>名前</span><select id="shiftStaff"></select></label>
  <label><span>週の開始日</span><input id="shiftRegisterWeekStart" type="date"></label>
  <div class="meta" style="margin-bottom:10px">〇＝出勤可　△＝相談　×＝出勤不可</div>
  <div id="shiftWeekRegister" class="week-grid"></div>
  <button class="btn gold full" id="saveShiftWeekBtn" style="margin-top:12px">1週間分を登録</button>
 </div>
</section>

<section id="shift-check" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="section-head"><h2>シフト確認</h2></div>
 <div class="card"><div class="form-grid"><label><span>表示</span><select id="shiftFilterStaff"></select></label><label><span>週の開始日</span><input id="shiftWeekStart" type="date"></label></div></div>
 <div id="shiftWeekView" class="week-table-wrap"></div>
</section>

<section id="schedules" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="section-head"><h2>同伴・来店予定</h2><button class="btn gold" id="addScheduleBtn">＋追加</button></div>
 <div id="scheduleList" class="list"></div>
</section>

<section id="customers" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="section-head"><h2>お客様情報</h2><button class="btn gold" id="addCustomerBtn">＋登録</button></div>
 <div id="customerList" class="list"></div>
</section>

<section id="bottles" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="section-head"><h2>ボトル確認</h2><button class="btn gold" id="addBottleBtn">＋登録</button></div>
 <div id="bottleList" class="list"></div>
</section>

<section id="notices" class="hidden">
 <button class="btn ghost" data-view="home">← ホーム</button>
 <div class="section-head"><h2>お知らせ</h2><button class="btn gold" id="addNoticeBtn">＋追加</button></div>
 <div id="noticeList" class="list"></div>
</section>
</main>

<dialog id="scheduleDialog"><div class="modal"><div class="modal-head"><h2>同伴・来店予定を登録</h2><button class="close" data-close="scheduleDialog">×</button></div>
<div class="form-grid">
<label><span>日付</span><input id="schDate" type="date"></label>
<label><span>種別</span><select id="schType"><option value="companion">同伴</option><option value="visit">来店予定</option></select></label>
<label><span>時間</span><input id="schTime" type="time"></label>
<label><span>お客様名</span><input id="schCustomer"></label>
<label><span>担当</span><select id="schMainCast"></select></label>
<label><span>人数</span><input id="schPeople" type="number" min="1" value="1"></label>
<div class="span2"><span style="display:block;color:#d9c38c;font-size:12px;font-weight:800;margin-bottom:5px">同行キャスト</span><div id="companionChoices" class="choices"></div></div>
<div class="span2"><span style="display:block;color:#d9c38c;font-size:12px;font-weight:800;margin-bottom:5px">席</span><div id="seatChoices" class="choices"></div></div>
<label class="span2"><span>備考</span><textarea id="schMemo"></textarea></label>
</div><button class="btn gold full" id="saveScheduleBtn">登録</button></div></dialog>

<dialog id="simpleDialog"><div class="modal"><div class="modal-head"><h2 id="simpleTitle"></h2><button class="close" data-close="simpleDialog">×</button></div><div id="simpleBody"></div></div></dialog>
<dialog id="adminDialog"><div class="modal"><div class="modal-head"><h2>管理者ログイン</h2><button class="close" data-close="adminDialog">×</button></div><label><span>パスコード</span><input id="adminPass" type="password"></label><button class="btn gold full" id="adminLogin">ログイン</button></div></dialog>
<div id="toast" class="toast"></div>

<script>
'use strict';
const KEY='tinkerbell_clean_v6',CASTS=['あい','れな','みく','ゆい','るな','りか'],SEATS=['カウンター','1','2','3','4','5'];
const todayISO=()=>new Date().toLocaleDateString('sv-SE'),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2);
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{shifts:[],schedules:[],customers:[],bottles:[],notices:[]},selectedCompanions=[],selectedSeat='カウンター';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)};
function showView(id){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='shift-check')renderShiftCheck();if(id==='schedules')renderSchedules();if(id==='customers')renderCustomers();if(id==='bottles')renderBottles();if(id==='notices')renderNotices()}
function startOfWeek(s){const d=s?new Date(s+'T00:00:00'):new Date(),o=(d.getDay()+6)%7;d.setDate(d.getDate()-o);return d}
function fmt(d){return d.toLocaleDateString('sv-SE')}
function weekDates(s){const a=startOfWeek(s);return Array.from({length:7},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return d})}
function renderShiftRegister(){const staff=shiftStaff.value,dates=weekDates(shiftRegisterWeekStart.value);shiftWeekRegister.innerHTML=dates.map(d=>{const date=fmt(d),x=db.shifts.find(v=>v.staff===staff&&v.date===date),m=x?.mark||'';return `<div class="week-day" data-date="${date}"><div class="date">${d.getMonth()+1}/${d.getDate()}</div><div class="dow">${'日月火水木金土'[d.getDay()]}</div><div class="mark-group"><button class="mark-btn ${m==='o'?'selected':''}" data-mark="o">〇</button><button class="mark-btn ${m==='tri'?'selected':''}" data-mark="tri">△</button><button class="mark-btn ${m==='x'?'selected':''}" data-mark="x">×</button></div></div>`}).join('')}
function renderShiftCheck(){const dates=weekDates(shiftWeekStart.value),selected=shiftFilterStaff.value,staffs=selected==='all'?CASTS:[selected];const head=`<div class="cell head">名前</div>`+dates.map(d=>`<div class="cell head">${d.getMonth()+1}/${d.getDate()}<br>${'日月火水木金土'[d.getDay()]}</div>`).join('');const rows=staffs.map(st=>`<div class="cell name">${st}</div>`+dates.map(d=>{const m=db.shifts.find(x=>x.staff===st&&x.date===fmt(d))?.mark||'';return `<div class="cell"><span class="mark ${m||'none'}">${m==='o'?'〇':m==='tri'?'△':m==='x'?'×':'－'}</span></div>`}).join('')).join('');shiftWeekView.innerHTML=`<div class="week-table">${head}${rows}</div>`}
function openSchedule(){schDate.value=todayISO();schType.value='companion';schTime.value='21:00';schTime.readOnly=true;schCustomer.value='';schMainCast.value=CASTS[0];schPeople.value=1;schMemo.value='';selectedCompanions=[];selectedSeat='カウンター';renderChoices();scheduleDialog.showModal()}
function renderChoices(){companionChoices.innerHTML=CASTS.map(c=>`<button type="button" class="choice ${selectedCompanions.includes(c)?'selected':''}" data-comp="${c}">${c}</button>`).join('');seatChoices.innerHTML=SEATS.map(s=>`<button type="button" class="choice ${selectedSeat===s?'selected':''}" data-seat="${s}">${s==='カウンター'?'カウンター':'BOX'+s}</button>`).join('')}
function renderSchedules(){scheduleList.innerHTML=db.schedules.length?db.schedules.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="row"><div class="title">${x.date} ${x.time}　${x.customer}</div><div class="meta">${x.type==='companion'?'同伴':'来店予定'}／担当:${x.mainCast}／同行:${x.companions.join('・')||'なし'}／席:${x.seat==='カウンター'?'カウンター':'BOX'+x.seat}</div></div>`).join(''):'<div class="card">予定はありません</div>'}
function renderCustomers(){customerList.innerHTML=db.customers.length?db.customers.map(x=>`<div class="row"><div class="title">${x.name}</div><div class="meta">担当:${x.cast}</div></div>`).join(''):'<div class="card">お客様情報はありません</div>'}
function renderBottles(){bottleList.innerHTML=db.bottles.length?db.bottles.map(x=>`<div class="row"><div class="title">${x.customer}／${x.name}</div><div class="meta">担当:${x.cast}／本数:${x.qty}</div></div>`).join(''):'<div class="card">ボトル情報はありません</div>'}
function renderNotices(){noticeList.innerHTML=db.notices.length?db.notices.map(x=>`<div class="row"><div class="title">${x.title}</div><div class="meta">${x.body}</div></div>`).join(''):'<div class="card">お知らせはありません</div>'}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v)return showView(v.dataset.view);const m=e.target.closest('.mark-btn');if(m){m.parentElement.querySelectorAll('.mark-btn').forEach(b=>b.classList.remove('selected'));m.classList.add('selected');return}const c=e.target.closest('[data-comp]');if(c){selectedCompanions=selectedCompanions.includes(c.dataset.comp)?selectedCompanions.filter(x=>x!==c.dataset.comp):[...selectedCompanions,c.dataset.comp];renderChoices();return}const s=e.target.closest('[data-seat]');if(s){selectedSeat=s.dataset.seat;renderChoices();return}const cl=e.target.closest('[data-close]');if(cl)document.getElementById(cl.dataset.close).close()});
saveShiftWeekBtn.onclick=()=>{[...document.querySelectorAll('[data-date]')].forEach(card=>{const sel=card.querySelector('.mark-btn.selected');if(!sel)return;const ex=db.shifts.find(x=>x.staff===shiftStaff.value&&x.date===card.dataset.date);if(ex)ex.mark=sel.dataset.mark;else db.shifts.push({id:uid(),staff:shiftStaff.value,date:card.dataset.date,mark:sel.dataset.mark})});save();toast('1週間分を登録しました');renderShiftCheck()};
shiftStaff.onchange=renderShiftRegister;shiftRegisterWeekStart.onchange=renderShiftRegister;shiftFilterStaff.onchange=renderShiftCheck;shiftWeekStart.onchange=renderShiftCheck;
addScheduleHome.onclick=openSchedule;addScheduleBtn.onclick=openSchedule;schType.onchange=()=>{if(schType.value==='companion'){schTime.value='21:00';schTime.readOnly=true}else schTime.readOnly=false};
saveScheduleBtn.onclick=()=>{const o={id:uid(),date:schDate.value,type:schType.value,time:schType.value==='companion'?'21:00':schTime.value,customer:schCustomer.value.trim(),mainCast:schMainCast.value,people:+schPeople.value||1,companions:selectedCompanions.filter(x=>x!==schMainCast.value),seat:selectedSeat,memo:schMemo.value.trim()};if(!o.customer)return toast('お客様名を入力');db.schedules.push(o);save();scheduleDialog.close();toast('予定を登録しました')};
addCustomerBtn.onclick=()=>{simpleTitle.textContent='お客様登録';simpleBody.innerHTML='<label><span>お客様名</span><input id="tmp1"></label><label><span>担当</span><select id="tmp2">'+CASTS.map(x=>`<option>${x}</option>`).join('')+'</select></label><button class="btn gold full" id="tmpSave">保存</button>';simpleDialog.showModal();tmpSave.onclick=()=>{if(!tmp1.value.trim())return;db.customers.push({id:uid(),name:tmp1.value.trim(),cast:tmp2.value});save();simpleDialog.close();renderCustomers()}};
addBottleBtn.onclick=()=>{simpleTitle.textContent='ボトル登録';simpleBody.innerHTML='<label><span>お客様名</span><input id="tmp1"></label><label><span>ボトル名</span><input id="tmp2"></label><label><span>担当</span><select id="tmp3">'+CASTS.map(x=>`<option>${x}</option>`).join('')+'</select></label><label><span>本数</span><input id="tmp4" type="number" value="1"></label><button class="btn gold full" id="tmpSave">保存</button>';simpleDialog.showModal();tmpSave.onclick=()=>{if(!tmp1.value.trim()||!tmp2.value.trim())return;db.bottles.push({id:uid(),customer:tmp1.value.trim(),name:tmp2.value.trim(),cast:tmp3.value,qty:+tmp4.value||1});save();simpleDialog.close();renderBottles()}};
addNoticeBtn.onclick=()=>{simpleTitle.textContent='お知らせ追加';simpleBody.innerHTML='<label><span>タイトル</span><input id="tmp1"></label><label><span>本文</span><textarea id="tmp2"></textarea></label><button class="btn gold full" id="tmpSave">保存</button>';simpleDialog.showModal();tmpSave.onclick=()=>{if(!tmp1.value.trim())return;db.notices.push({id:uid(),title:tmp1.value.trim(),body:tmp2.value.trim()});save();simpleDialog.close();renderNotices()}};
adminBtn.onclick=()=>adminDialog.showModal();adminLogin.onclick=()=>{if(adminPass.value==='1234')toast('ログインしました');else toast('パスコードが違います')};
const options=CASTS.map(x=>`<option>${x}</option>`).join('');shiftStaff.innerHTML=options;shiftFilterStaff.innerHTML='<option value="all">全員</option>'+options;schMainCast.innerHTML=options;
const monday=fmt(startOfWeek(todayISO()));shiftRegisterWeekStart.value=monday;shiftWeekStart.value=monday;renderShiftRegister();renderShiftCheck();
const toastEl=document.getElementById('toast');
</script>
</body>
</html>
