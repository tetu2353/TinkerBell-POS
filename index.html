<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>ティンカーベル STAFF</title></head><body><header><div><div class="eyebrow">TINKER BELL</div><h1>STAFF</h1></div><button id="homeBtn">ホーム</button></header><main><section id="home" class="screen active"><div class="hero"><h2>Tinker Bell STAFF</h2><p>スタッフ専用メニュー</p></div><div class="menu-grid"><button data-target="attendance">📅<b>出勤登録</b><small>出勤・退勤予定</small></button><button data-target="shifts">📋<b>シフト確認</b><small>登録済み予定</small></button><button data-target="visits">🥂<b>同伴・来店予定</b><small>予定を登録</small></button><button data-target="customers">👤<b>お客様管理</b><small>担当・メモ</small></button><button data-target="bottles">🍾<b>ボトル管理</b><small>種類・残量</small></button><button data-target="notices">🔔<b>お知らせ</b><small>店舗からの連絡</small></button></div></section><section id="attendance" class="screen"><h2>出勤登録</h2><div class="card"><label>名前<select id="attName"></select></label><label>日付<input id="attDate" type="date"></label><div class="two"><label>出勤<select id="attStart"></select></label><label>退勤<select id="attEnd"></select></label></div><label>メモ<textarea id="attNote" rows="3"></textarea></label><button id="saveAttendance" class="primary">登録する</button></div></section><section id="shifts" class="screen"><h2>シフト確認</h2><div class="card"><label>表示日<input id="shiftFilter" type="date"></label><button id="showAllShifts" class="secondary">全日程</button></div><div id="shiftList" class="list"></div></section><section id="visits" class="screen"><h2>同伴・来店予定</h2><div class="card"><label>担当<select id="visitCast"></select></label><label>お客様名<input id="visitCustomer"></label><label>日付<input id="visitDate" type="date"></label><label>区分<select id="visitType"><option>同伴</option><option>来店予定</option><option>予約</option></select></label><label>時間<input id="visitTime" type="time"></label><label>メモ<textarea id="visitNote" rows="3"></textarea></label><button id="saveVisit" class="primary">登録する</button></div><div id="visitList" class="list"></div></section><section id="customers" class="screen"><h2>お客様管理</h2><div class="card"><label>検索<input id="customerSearch" placeholder="名前・担当・メモ"></label></div><div class="card"><label>お客様名<input id="customerName"></label><label>担当<select id="customerCast"></select></label><label>誕生日<input id="customerBirthday" type="date"></label><label>メモ<textarea id="customerMemo" rows="3"></textarea></label><button id="saveCustomer" class="primary">登録する</button></div><div id="customerList" class="list"></div></section><section id="bottles" class="screen"><h2>ボトル管理</h2><div class="card"><label>お客様<select id="bottleCustomer"></select></label><label>ボトル名<input id="bottleName"></label><label>残量<select id="bottleLevel"><option>満タン</option><option>75%</option><option>50%</option><option>25%</option><option>ほぼ空</option></select></label><label>保管場所<input id="bottlePlace"></label><button id="saveBottle" class="primary">登録する</button></div><div id="bottleList" class="list"></div></section><section id="notices" class="screen"><h2>お知らせ</h2><div class="card"><label>タイトル<input id="noticeTitle"></label><label>本文<textarea id="noticeBody" rows="4"></textarea></label><button id="saveNotice" class="primary">追加する</button></div><div id="noticeList" class="list"></div></section></main><nav><button data-target="home" class="active">⌂<span>ホーム</span></button><button data-target="attendance">📅<span>出勤</span></button><button data-target="customers">👤<span>顧客</span></button><button data-target="bottles">🍾<span>ボトル</span></button></nav><div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
