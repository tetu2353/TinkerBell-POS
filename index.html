<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17121f">
<title>Tinker Bell Club POS</title>
<style>
:root{--bg:#f5f3f7;--panel:#fff;--ink:#201828;--muted:#756c7e;--line:#e5dfe9;--main:#6d3b78;--main2:#9f6bac;--gold:#b9944e;--ok:#17734d;--warn:#a65b00;--danger:#b43b4b;--shadow:0 10px 28px rgba(38,20,47,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#17121f,#392342);color:#fff;padding:14px 16px;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:21px;letter-spacing:.03em}.sub{font-size:12px;color:#dbcfe0;margin-top:3px}
main{padding:14px 14px 90px;max-width:1100px;margin:auto}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 14px}.nav button{border:0;border-radius:12px;padding:11px 5px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.05)}.nav button.active{background:var(--main);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.summary>div{background:#fff;border-radius:15px;padding:13px;box-shadow:var(--shadow)}.summary small{color:var(--muted)}.summary strong{display:block;font-size:22px;margin-top:3px}
.card{background:#fff;border-radius:17px;padding:15px;box-shadow:var(--shadow);margin-bottom:13px}.card h2,.card h3{margin:0 0 10px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 11px}.section-title h2{font-size:20px;margin:0}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:850;background:#ece7ef;color:var(--ink)}.btn.primary{background:var(--main);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.small{padding:8px 10px;border-radius:9px;font-size:13px}
.grid{display:grid;gap:11px}.seat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.seat{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;text-align:left;min-height:145px}.seat.used{border-color:var(--main2);background:#fcf9fd}.seat.vip{box-shadow:inset 0 0 0 2px rgba(185,148,78,.25)}.seat-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.seat-name{font-size:18px;font-weight:900}.status{font-size:12px;border-radius:999px;padding:4px 8px;background:#eee}.status.used{background:#ead9ef;color:#5c246a}.status.empty{background:#e9f4ee;color:#17613f}.customer{font-size:19px;font-weight:900;margin-top:12px}.meta{color:var(--muted);font-size:13px;line-height:1.6}.money{font-size:19px;font-weight:900;color:var(--main);margin-top:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:block}.field span{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field.full{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid #cbc3cf;border-radius:11px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:75px;resize:vertical}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #cabed0;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.choice.selected{background:var(--main);color:#fff;border-color:var(--main)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions .btn{flex:1}
.category-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:7px;margin-bottom:10px}.category-tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.category-tabs button.active{background:var(--main);color:#fff;border-color:var(--main)}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.menu-item{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left}.menu-item b{display:block}.menu-item span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.line:last-child{border-bottom:0}.line-title{font-weight:850}.line-sub{font-size:12px;color:var(--muted);margin-top:3px}.line-right{text-align:right;font-weight:900}.qty{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:5px}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#ece7ef;font-weight:900}
.total-box{background:#f4eef6;border-radius:14px;padding:14px;margin-top:10px}.total-row{display:flex;justify-content:space-between;padding:5px 0}.total-row.grand{font-size:23px;font-weight:950;border-top:1px solid #d6c8dc;margin-top:7px;padding-top:10px}
.empty-box{text-align:center;color:var(--muted);padding:25px 10px}
dialog{border:0;padding:0;border-radius:18px;width:min(720px,95vw);max-height:92vh;overflow:auto;box-shadow:0 25px 90px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(20,12,24,.62)}.modal{padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.modal-head h2{margin:0}.x{border:0;background:#eee6f0;width:38px;height:38px;border-radius:50%;font-size:20px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#211729;color:#fff;padding:11px 16px;border-radius:999px;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:3px 7px;background:#eee6f0;color:#593566}
.history-row{border-bottom:1px solid var(--line);padding:12px 0}.history-row:last-child{border-bottom:0}
@media(min-width:760px){.seat-grid{grid-template-columns:repeat(3,1fr)}.menu-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.nav{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:1fr 1fr}.summary>div:last-child{grid-column:1/-1}.seat-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div><div class="brand">TINKER BELL CLUB POS</div><div class="sub">席・注文・会計・メニュー管理</div></div>
    <button class="btn small gold" id="backupBtn">バックアップ</button>
  </div>
</header>
<main>
  <nav class="nav" id="nav">
    <button data-view="dashboard" class="active">ホーム</button>
    <button data-view="seats">席管理</button>
    <button data-view="orders">注文</button>
    <button data-view="menu">メニュー</button>
    <button data-view="history">会計履歴</button>
  </nav>

  <section id="dashboard" class="view">
    <div class="summary">
      <div><small>使用中の席</small><strong id="sumSeats">0</strong></div>
      <div><small>未会計</small><strong id="sumOpen">¥0</strong></div>
      <div><small>本日の売上</small><strong id="sumSales">¥0</strong></div>
    </div>
    <div class="card">
      <div class="section-title"><h2>席の状況</h2><button class="btn small primary" data-go="seats">席管理を開く</button></div>
      <div id="dashboardSeats" class="grid seat-grid"></div>
    </div>
  </section>

  <section id="seats" class="view hidden">
    <div class="section-title"><h2>席管理</h2><button class="btn small primary" id="newVisitBtn">来店入力</button></div>
    <div id="seatGrid" class="grid seat-grid"></div>
  </section>

  <section id="orders" class="view hidden">
    <div class="card">
      <div class="section-title"><h2>注文入力</h2></div>
      <label class="field"><span>席を選択</span><select id="orderSeatSelect"></select></label>
    </div>
    <div id="orderWorkspace"></div>
  </section>

  <section id="menu" class="view hidden">
    <div class="card">
      <h2>メニュー追加</h2>
      <div class="form-grid">
        <label class="field"><span>商品名</span><input id="menuName" placeholder="例：モエ・エ・シャンドン"></label>
        <label class="field"><span>カテゴリ</span><select id="menuCategory"></select></label>
        <label class="field"><span>販売価格</span><input id="menuPrice" type="number" min="0" inputmode="numeric"></label>
        <label class="field"><span>キャストバック</span><input id="menuBack" type="number" min="0" value="0" inputmode="numeric"></label>
      </div>
      <div class="actions"><button class="btn primary" id="addMenuBtn">商品を追加</button></div>
    </div>
    <div id="menuAdminList"></div>
  </section>

  <section id="history" class="view hidden">
    <div class="card"><div class="section-title"><h2>会計履歴</h2><button class="btn small ghost" id="exportBtn">CSV出力</button></div><div id="historyList"></div></div>
  </section>
</main>

<dialog id="visitDialog">
  <div class="modal">
    <div class="modal-head"><h2 id="visitTitle">来店入力</h2><button class="x" data-close="visitDialog">×</button></div>
    <div class="form-grid">
      <label class="field"><span>席</span><select id="visitSeat"></select></label>
      <label class="field"><span>お客様名</span><input id="visitCustomer" placeholder="例：佐藤様" autocomplete="off"></label>
      <label class="field"><span>人数</span><input id="visitPeople" type="number" min="1" value="1" inputmode="numeric"></label>
      <div class="field"><span>席種</span><div class="choice-row" id="seatTypeChoices"><button type="button" class="choice selected" data-type="一般席">一般席</button><button type="button" class="choice" data-type="VIP席">VIP席</button></div></div>
      <div class="field full"><span>担当キャスト（複数選択可）</span><div class="choice-row" id="castChoices"></div></div>
      <label class="field full"><span>メモ</span><textarea id="visitMemo" placeholder="来店予定、好み、注意事項など"></textarea></label>
    </div>
    <div class="actions"><button class="btn primary" id="saveVisitBtn">来店を保存</button><button class="btn danger hidden" id="clearSeatBtn">席を空ける</button></div>
  </div>
</dialog>

<dialog id="checkoutDialog">
  <div class="modal">
    <div class="modal-head"><h2>会計確認</h2><button class="x" data-close="checkoutDialog">×</button></div>
    <div id="checkoutSummary"></div>
    <div class="form-grid">
      <label class="field"><span>値引き</span><input id="discountInput" type="number" min="0" value="0" inputmode="numeric"></label>
      <label class="field"><span>支払方法</span><select id="paymentMethod"><option>現金</option><option>カード</option><option>売掛</option><option>その他</option></select></label>
    </div>
    <div class="actions"><button class="btn ok" id="confirmCheckoutBtn">会計を確定</button></div>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script>
'use strict';
const KEY='tinkerbell_club_pos_v1';
const CATEGORIES=['ドリンク','ボトル','シャンパン','ワイン','セット料金','アイス・割り物','フード','同伴料','その他'];
const CASTS=['あい','れな','みか','ゆい','さき'];
const DEFAULT_MENU=[
 {id:'set-general',name:'一般席セット料金',category:'セット料金',price:0,back:0},
 {id:'set-vip',name:'VIP席セット料金',category:'セット料金',price:0,back:0},
 {id:'drink-cast',name:'キャストドリンク',category:'ドリンク',price:1000,back:300},
 {id:'drink-beer',name:'ビール',category:'ドリンク',price:800,back:0},
 {id:'mixer-ice',name:'アイス',category:'アイス・割り物',price:500,back:0},
 {id:'mixer-water',name:'ミネラルウォーター',category:'アイス・割り物',price:500,back:0},
 {id:'mixer-soda',name:'炭酸',category:'アイス・割り物',price:500,back:0},
 {id:'companion',name:'同伴料',category:'同伴料',price:0,back:0}
];
const seatNames=[...Array.from({length:6},(_,i)=>`カウンター${i+1}`),...Array.from({length:5},(_,i)=>`BOX${i+1}`)];
const emptySeat=name=>({id:name,name,status:'empty',customer:'',people:1,seatType:'一般席',casts:[],memo:'',openedAt:null,orders:[]});
function initialState(){return{version:1,seats:seatNames.map(emptySeat),menu:structuredClone(DEFAULT_MENU),checkouts:[]}}
function load(){
 try{
  const v=JSON.parse(localStorage.getItem(KEY));
  if(!v||!Array.isArray(v.seats)||!Array.isArray(v.menu)||!Array.isArray(v.checkouts))return initialState();
  for(const n of seatNames)if(!v.seats.some(s=>s.id===n))v.seats.push(emptySeat(n));
  for(const m of DEFAULT_MENU)if(!v.menu.some(x=>x.id===m.id))v.menu.push(structuredClone(m));
  return v;
 }catch(e){return initialState()}
}
let db=load();
let visitDraft={seatId:'',customer:'',people:1,seatType:'一般席',casts:[],memo:''};
let selectedCategory='ドリンク';
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n)||0);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const today=()=>new Date().toLocaleDateString('sv-SE');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
function seatTotal(s){return s.orders.reduce((a,o)=>a+(Number(o.price)||0)*(Number(o.qty)||0),0)}
function usedSeats(){return db.seats.filter(s=>s.status==='used')}
function getSeat(id){return db.seats.find(s=>s.id===id)}
function showView(id){
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));
 if(id==='orders')renderOrders();
 if(id==='menu')renderMenuAdmin();
 if(id==='history')renderHistory();
 window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){renderSummary();renderSeats();renderOrderSeatSelect();renderMenuAdmin();renderHistory()}
function renderSummary(){
 $('sumSeats').textContent=usedSeats().length;
 $('sumOpen').textContent=yen(usedSeats().reduce((a,s)=>a+seatTotal(s),0));
 $('sumSales').textContent=yen(db.checkouts.filter(c=>c.date===today()).reduce((a,c)=>a+c.total,0));
 $('dashboardSeats').innerHTML=db.seats.map(seatCard).join('');
}
function seatCard(s){
 const used=s.status==='used';
 return `<button class="seat ${used?'used':''} ${s.seatType==='VIP席'?'vip':''}" data-seat="${esc(s.id)}">
 <div class="seat-head"><span class="seat-name">${esc(s.name)}</span><span class="status ${used?'used':'empty'}">${used?'使用中':'空席'}</span></div>
 ${used?`<div class="customer">${esc(s.customer||'お名前未入力')}</div>
 <div class="meta">${esc(s.seatType)}・${s.people}名<br>担当：${s.casts.length?s.casts.map(esc).join('・'):'なし'}<br>注文 ${s.orders.reduce((a,o)=>a+o.qty,0)}点</div>
 <div class="money">${yen(seatTotal(s))}</div>`:`<div class="empty-box">タップして来店入力</div>`}
 </button>`;
}
function renderSeats(){$('seatGrid').innerHTML=db.seats.map(seatCard).join('')}
function syncVisitDraftFromInputs(){
 visitDraft.customer=$('visitCustomer').value;
 visitDraft.people=Math.max(1,Number($('visitPeople').value)||1);
 visitDraft.memo=$('visitMemo').value;
}
function openVisit(seatId){
 const s=getSeat(seatId)||db.seats.find(x=>x.status==='empty')||db.seats[0];
 visitDraft={seatId:s.id,customer:s.status==='used'?s.customer:'',people:s.status==='used'?s.people:1,seatType:s.status==='used'?s.seatType:'一般席',casts:s.status==='used'?[...s.casts]:[],memo:s.status==='used'?s.memo:''};
 $('visitTitle').textContent=s.status==='used'?'席情報を編集':'来店入力';
 $('visitSeat').innerHTML=db.seats.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.status==='used'&&x.id!==s.id?'（使用中）':''}</option>`).join('');
 $('visitSeat').value=s.id;
 $('visitCustomer').value=visitDraft.customer;
 $('visitPeople').value=visitDraft.people;
 $('visitMemo').value=visitDraft.memo;
 renderSeatTypeChoices();
 renderCastChoices();
 $('clearSeatBtn').classList.toggle('hidden',s.status!=='used');
 $('visitDialog').showModal();
}
function renderSeatTypeChoices(){
 document.querySelectorAll('#seatTypeChoices .choice').forEach(b=>b.classList.toggle('selected',b.dataset.type===visitDraft.seatType));
}
function renderCastChoices(){
 $('castChoices').innerHTML=CASTS.map(c=>`<button type="button" class="choice ${visitDraft.casts.includes(c)?'selected':''}" data-cast="${esc(c)}">${esc(c)}</button>`).join('');
}
function saveVisit(){
 syncVisitDraftFromInputs();
 if(!visitDraft.customer.trim())return toast('お客様名を入力してください');
 const s=getSeat(visitDraft.seatId);
 if(!s)return toast('席が見つかりません');
 Object.assign(s,{status:'used',customer:visitDraft.customer.trim(),people:visitDraft.people,seatType:visitDraft.seatType,casts:[...visitDraft.casts],memo:visitDraft.memo,openedAt:s.openedAt||new Date().toISOString()});
 if(!s.orders.length){
  const setItem=db.menu.find(m=>m.id===(s.seatType==='VIP席'?'set-vip':'set-general'));
  if(setItem&&Number(setItem.price)>0)s.orders.push({id:uid(),menuId:setItem.id,name:setItem.name,category:setItem.category,price:Number(setItem.price),back:Number(setItem.back)||0,qty:s.people,cast:''});
 }
 save();$('visitDialog').close();renderAll();toast('来店を保存しました');
}
function clearSeat(){
 const s=getSeat(visitDraft.seatId);if(!s)return;
 if(s.orders.length&&!confirm('未会計の注文も消して席を空けます。よろしいですか？'))return;
 Object.assign(s,emptySeat(s.name));save();$('visitDialog').close();renderAll();toast('席を空けました');
}
function renderOrderSeatSelect(){
 const current=$('orderSeatSelect').value;
 const used=usedSeats();
 $('orderSeatSelect').innerHTML=used.length?used.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}｜${esc(s.customer)}</option>`).join(''):'<option value="">使用中の席がありません</option>';
 if(used.some(s=>s.id===current))$('orderSeatSelect').value=current;
}
function renderOrders(){
 renderOrderSeatSelect();
 const id=$('orderSeatSelect').value;
 const s=getSeat(id);
 if(!s||s.status!=='used'){$('orderWorkspace').innerHTML='<div class="card empty-box">先に席管理から来店登録してください</div>';return}
 $('orderWorkspace').innerHTML=`
 <div class="card"><div class="section-title"><h2>${esc(s.name)}　${esc(s.customer)}</h2><button class="btn small gold" id="checkoutBtn">会計へ</button></div>
 <div class="meta">${esc(s.seatType)}・${s.people}名／担当 ${s.casts.length?s.casts.map(esc).join('・'):'なし'}</div></div>
 <div class="card"><h3>商品を追加</h3><div class="category-tabs" id="categoryTabs"></div><div class="menu-grid" id="orderMenuGrid"></div></div>
 <div class="card"><h3>注文一覧</h3><div id="orderLines"></div><div class="total-box"><div class="total-row grand"><span>合計</span><span>${yen(seatTotal(s))}</span></div></div></div>`;
 renderCategoryTabs();renderOrderMenu();renderOrderLines();
 $('checkoutBtn').onclick=()=>openCheckout(s.id);
}
function renderCategoryTabs(){
 $('categoryTabs').innerHTML=CATEGORIES.map(c=>`<button class="${c===selectedCategory?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderOrderMenu(){
 const items=db.menu.filter(m=>m.category===selectedCategory);
 $('orderMenuGrid').innerHTML=items.length?items.map(m=>`<button class="menu-item" data-menu="${esc(m.id)}"><b>${esc(m.name)}</b><span>${yen(m.price)}${m.back?`／バック ${yen(m.back)}`:''}</span></button>`).join(''):'<div class="empty-box">このカテゴリの商品は未登録です</div>';
}
function renderOrderLines(){
 const s=getSeat($('orderSeatSelect').value);if(!s)return;
 $('orderLines').innerHTML=s.orders.length?s.orders.map(o=>`<div class="line"><div><div class="line-title">${esc(o.name)}</div><div class="line-sub">${esc(o.category)}${o.cast?`／担当 ${esc(o.cast)}`:''}</div></div><div class="line-right">${yen(o.price*o.qty)}<div class="qty"><button data-minus="${esc(o.id)}">−</button><span>${o.qty}</span><button data-plus="${esc(o.id)}">＋</button><button data-remove="${esc(o.id)}">×</button></div></div></div>`).join(''):'<div class="empty-box">注文はまだありません</div>';
}
function addOrder(menuId){
 const s=getSeat($('orderSeatSelect').value),m=db.menu.find(x=>x.id===menuId);if(!s||!m)return;
 let cast='';
 if(Number(m.back)>0&&s.casts.length){
  cast=prompt(`バックを付ける担当キャスト\n${s.casts.join(' / ')}`,s.casts[0])||'';
  if(cast&&!s.casts.includes(cast))return toast('担当キャスト名が一致しません');
 }
 const same=s.orders.find(o=>o.menuId===m.id&&o.cast===cast);
 if(same)same.qty++;else s.orders.push({id:uid(),menuId:m.id,name:m.name,category:m.category,price:Number(m.price)||0,back:Number(m.back)||0,qty:1,cast});
 save();renderOrders();renderSummary();toast(`${m.name}を追加しました`);
}
function changeQty(orderId,delta){
 const s=getSeat($('orderSeatSelect').value),o=s?.orders.find(x=>x.id===orderId);if(!o)return;
 o.qty+=delta;if(o.qty<=0)s.orders=s.orders.filter(x=>x.id!==orderId);
 save();renderOrders();renderSummary();
}
function removeOrder(orderId){const s=getSeat($('orderSeatSelect').value);if(!s)return;s.orders=s.orders.filter(x=>x.id!==orderId);save();renderOrders();renderSummary()}
function openCheckout(seatId){
 const s=getSeat(seatId);if(!s)return;
 $('checkoutDialog').dataset.seatId=seatId;$('discountInput').value=0;$('paymentMethod').value='現金';
 updateCheckoutSummary();$('checkoutDialog').showModal();
}
function updateCheckoutSummary(){
 const s=getSeat($('checkoutDialog').dataset.seatId);if(!s)return;
 const subtotal=seatTotal(s),discount=Math.max(0,Number($('discountInput').value)||0),total=Math.max(0,subtotal-discount);
 $('checkoutSummary').innerHTML=`<div class="card"><h3>${esc(s.name)}　${esc(s.customer)}</h3>${s.orders.map(o=>`<div class="total-row"><span>${esc(o.name)} × ${o.qty}</span><span>${yen(o.price*o.qty)}</span></div>`).join('')}<div class="total-box"><div class="total-row"><span>小計</span><span>${yen(subtotal)}</span></div><div class="total-row"><span>値引き</span><span>−${yen(discount)}</span></div><div class="total-row grand"><span>お支払い</span><span>${yen(total)}</span></div></div></div>`;
}
function confirmCheckout(){
 const s=getSeat($('checkoutDialog').dataset.seatId);if(!s)return;
 if(!s.orders.length&&!confirm('注文が0件です。会計を確定しますか？'))return;
 const subtotal=seatTotal(s),discount=Math.max(0,Number($('discountInput').value)||0),total=Math.max(0,subtotal-discount);
 db.checkouts.unshift({id:uid(),date:today(),createdAt:new Date().toISOString(),seat:s.name,customer:s.customer,people:s.people,seatType:s.seatType,casts:[...s.casts],items:structuredClone(s.orders),subtotal,discount,total,payment:$('paymentMethod').value});
 Object.assign(s,emptySeat(s.name));save();$('checkoutDialog').close();renderAll();showView('dashboard');toast('会計を確定しました');
}
function renderMenuAdmin(){
 $('menuCategory').innerHTML=CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join('');
 $('menuAdminList').innerHTML=CATEGORIES.map(cat=>{
  const items=db.menu.filter(m=>m.category===cat);
  return `<div class="card"><h3>${esc(cat)} <span class="badge">${items.length}件</span></h3>${items.length?items.map(m=>`<div class="line"><div><div class="line-title">${esc(m.name)}</div><div class="line-sub">${yen(m.price)}／バック ${yen(m.back)}</div></div><div><button class="btn small ghost" data-edit-menu="${esc(m.id)}">編集</button> <button class="btn small danger" data-delete-menu="${esc(m.id)}">削除</button></div></div>`).join(''):'<div class="meta">未登録</div>'}</div>`;
 }).join('');
}
function addMenu(){
 const name=$('menuName').value.trim(),price=Math.max(0,Number($('menuPrice').value)||0),back=Math.max(0,Number($('menuBack').value)||0),category=$('menuCategory').value;
 if(!name)return toast('商品名を入力してください');
 db.menu.push({id:uid(),name,category,price,back});save();$('menuName').value='';$('menuPrice').value='';$('menuBack').value=0;renderMenuAdmin();toast('商品を追加しました');
}
function editMenu(id){
 const m=db.menu.find(x=>x.id===id);if(!m)return;
 const name=prompt('商品名',m.name);if(name===null||!name.trim())return;
 const price=prompt('販売価格',String(m.price));if(price===null)return;
 const back=prompt('キャストバック',String(m.back));if(back===null)return;
 m.name=name.trim();m.price=Math.max(0,Number(price)||0);m.back=Math.max(0,Number(back)||0);save();renderMenuAdmin();toast('商品を更新しました');
}
function deleteMenu(id){
 const m=db.menu.find(x=>x.id===id);if(!m||!confirm(`${m.name}を削除しますか？`))return;
 db.menu=db.menu.filter(x=>x.id!==id);save();renderMenuAdmin();toast('削除しました');
}
function renderHistory(){
 $('historyList').innerHTML=db.checkouts.length?db.checkouts.map(c=>`<div class="history-row"><div class="seat-head"><b>${esc(c.date)}　${esc(c.seat)}　${esc(c.customer)}</b><strong>${yen(c.total)}</strong></div><div class="meta">${c.people}名・${esc(c.seatType)}／${esc(c.payment)}／値引 ${yen(c.discount)}</div></div>`).join(''):'<div class="empty-box">会計履歴はまだありません</div>';
}
function exportCsv(){
 const rows=[['日付','席','お客様名','人数','席種','支払方法','小計','値引','合計'],...db.checkouts.map(c=>[c.date,c.seat,c.customer,c.people,c.seatType,c.payment,c.subtotal,c.discount,c.total])];
 const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`tinkerbell-sales-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);
}
function backup(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download=`tinkerbell-pos-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-view]');if(nav)return showView(nav.dataset.view);
 const go=e.target.closest('[data-go]');if(go)return showView(go.dataset.go);
 const close=e.target.closest('[data-close]');if(close)return $(close.dataset.close).close();
 const seat=e.target.closest('[data-seat]');if(seat)return openVisit(seat.dataset.seat);
 const type=e.target.closest('[data-type]');if(type){syncVisitDraftFromInputs();visitDraft.seatType=type.dataset.type;renderSeatTypeChoices();return}
 const cast=e.target.closest('[data-cast]');if(cast){syncVisitDraftFromInputs();const c=cast.dataset.cast;visitDraft.casts=visitDraft.casts.includes(c)?visitDraft.casts.filter(x=>x!==c):[...visitDraft.casts,c];renderCastChoices();return}
 const cat=e.target.closest('[data-category]');if(cat){selectedCategory=cat.dataset.category;renderCategoryTabs();renderOrderMenu();return}
 const menu=e.target.closest('[data-menu]');if(menu)return addOrder(menu.dataset.menu);
 const plus=e.target.closest('[data-plus]');if(plus)return changeQty(plus.dataset.plus,1);
 const minus=e.target.closest('[data-minus]');if(minus)return changeQty(minus.dataset.minus,-1);
 const rem=e.target.closest('[data-remove]');if(rem)return removeOrder(rem.dataset.remove);
 const edit=e.target.closest('[data-edit-menu]');if(edit)return editMenu(edit.dataset.editMenu);
 const del=e.target.closest('[data-delete-menu]');if(del)return deleteMenu(del.dataset.deleteMenu);
});
$('newVisitBtn').onclick=()=>openVisit(db.seats.find(s=>s.status==='empty')?.id||db.seats[0].id);
$('saveVisitBtn').onclick=saveVisit;
$('clearSeatBtn').onclick=clearSeat;
$('orderSeatSelect').onchange=renderOrders;
$('addMenuBtn').onclick=addMenu;
$('discountInput').oninput=updateCheckoutSummary;
$('confirmCheckoutBtn').onclick=confirmCheckout;
$('exportBtn').onclick=exportCsv;
$('backupBtn').onclick=backup;
renderAll();
</script>
</body>
</html>
